<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHARUSAT</title>
     <link rel="stylesheet" href="register.css">
      
</head>

<body>
<header>
<center>
<br>
<br>

    <h1>CHARUSAT</h1>
    <h3>Create Your Account</h3>

<hr>
</center>
</header>


<form>

<center>

<p> <b>Registration Form</b></p>   

<table>

<tr>
    <td><label for="name">Full Name</label></td>
    <td><input type="text" id="name" placeholder="Enter Full Name" required></td>
</tr>

<tr>
    <td><label for="email">Email</label></td>
    <td><input type="email" id="email" placeholder="Enter Email" required></td>
</tr>

<tr>
    <td><label for="mobile">Mobile</label></td>
    <td><input type="tel" id="mobile" placeholder="Enter Mobile Number" required></td>
</tr>





<tr>
    <td>Gender</td>
    <td>
        <input type="radio" name="gender" id="male">
        <label for="male">Male</label>

        <input type="radio" name="gender" id="female">
        <label for="female">Female</label>

        <input type="radio" name="gender" id="other">
        <label for="other">Other</label>
    </td>
</tr>

<tr>
    <td><label for="course">EVENTS</label></td>
    <td>
        <select id="course">
            <option>Select EVENTS</option>
            <option>TECHNICAL SEMINAR</option>
            <option>HACKETHON</option>
            <option>WORKSHPOP</option>
        </select>
    </td>
</tr>






<tr>
    <td colspan="2" align="center">
        <button type="submit">Register</button>
    
        <button type="reset">Clear</button>
    </td>
</tr>

</table>



</center>

</form>

<hr>

</center>
 
</body>
</html>
